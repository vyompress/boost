name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check coding standards
        run: composer lint

      - name: Run unit tests
        run: composer test

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production package
        shell: pwsh
        run: ./tools/build-release.ps1

      - name: Extract production package
        run: unzip -q ./dist/vyompress-boost-*.zip -d ./dist/plugin-check

      - name: Run official directory-readiness checks
        uses: WordPress/plugin-check-action@005058d6dbd2942b6a58610836b981c2ee3cc19d
        with:
          build-dir: ./dist/plugin-check/vyompress-boost

  package:
    name: Package release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, plugin-check]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release ZIP
        shell: pwsh
        run: ./tools/build-release.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME ./dist/vyompress-boost-*.zip --verify-tag --generate-notes --title "VyomPress Boost $env:GITHUB_REF_NAME"
